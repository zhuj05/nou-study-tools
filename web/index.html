<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NOU Study Tools">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NOU Study Tools</title>

  <style>
    /* 強制將 Loading 釘在最上層 */
    #loading-container {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      z-index: 2147483647 !important; /* 最高層級 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0d47a1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }

    .loading-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #64748b;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading 遮罩放在 body 最上方 -->
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">系統載入中</div>
    <div class="loading-subtitle">首次開啟需下載環境，請稍候...</div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById("loading-container");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    }

    // 監聽 Flutter 渲染完成
    window.addEventListener("flutter-first-frame", removeLoader);

    // 防呆保護：若超過 15 秒因事件遺失未觸發，也自動移除遮罩避免畫面卡住
    setTimeout(removeLoader, 15000);
  </script>

  <script src="flutter.js" defer></script>
  <script src="flet.js" defer></script>
</body>
</html>
