  <style>
    /* 全螢幕自訂載入畫面樣式（配合暗黑模式主題） */
    #custom-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a; /* 深色背景 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: opacity 0.5s ease-out;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #38bdf8; /* 水藍色旋轉條 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    .loading-title {
      color: #f8fafc;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .loading-subtitle {
      color: #94a3b8;
      font-size: 13px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 供搜尋引擎閱讀的預留區塊，視覺上由 Loading 遮罩覆蓋，渲染完成後自動被 Canvas 取代 */
    #seo-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      color: #e2e8f0;
      font-family: sans-serif;
      z-index: 1;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0f172a;">

  <!-- SEO 爬蟲文字區塊（讓 Googlebot 能直接索引文字與核心功能） -->
  <main id="seo-content">
    <h1>空大學業小幫手 (NOU Study Tools)</h1>
    <p>歡迎使用國立空中大學學業小幫手！本工具專為空大學生打造，協助您輕鬆規劃學分、計算畢業門檻與掌握修課進度。</p>
    <section>
      <h2>主要功能</h2>
      <ul>
        <li>一般學期與暑期(暑修)成績分數試算</li>
        <li>空大的學生考試與作業日程紀錄與學年行事曆</li>
        <li>空大學生常用校園網站連結與學習工具整合</li>
      </ul>
    </section>
  </main>

  <!-- 自訂 Loading 遮罩層 -->
  <div id="custom-loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-title">正在初始化小幫手引擎...</div>
    <div class="loading-subtitle">初次載入約需數秒，請稍候 ☕</div>
  </div>

  <script>
    // 定義隱藏 Loading 畫面的函式
    function removeLoadingScreen() {
      const loader = document.getElementById('custom-loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.remove();
        }, 500);
      }
    }

    // 監聽 Flutter 繪製完成事件，當主畫面出現時移除遮罩
    window.addEventListener('flutter-first-frame', function () {
      removeLoadingScreen();
    });

    // 備用機制：透過 MutationObserver 檢測 Flutter 畫布 (flt-glass-pane 或 canvas) 插入 DOM
    const observer = new MutationObserver((mutations, obs) => {
      if (document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        setTimeout(removeLoadingScreen, 600);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <!-- Flet / Flutter 原始載入腳本 -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // 停用 Flutter 預設 SW，由自訂 sw.js 接管
      _flutter.loader.loadEntrypoint({
        serviceWorker: null,
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <!-- 註冊自訂 Service Worker 加速載入 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('✅ Service Worker 註冊成功，範圍:', registration.scope);
          })
          .catch((error) => {
            console.error('❌ Service Worker 註冊失敗:', error);
          });
      });
    }
  </script>

</body>
