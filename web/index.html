<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NOU Study Tools">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NOU Study Tools</title>

  <style>
    /* 全螢幕置中容器 */
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* 圓環載入動畫 */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0d47a1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* 提示文字 */
    .loading-title {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }

    .loading-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #64748b;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 淡出狀態 */
    .loading-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Loading 骨架 -->
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">系統載入中</div>
    <div class="loading-subtitle">首次開啟需下載環境，請稍候...</div>
  </div>

  <!-- 監聽 Flutter 渲染完成並自動淡出 Loading 畫面 -->
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var loader = document.getElementById("loading-container");
      if (loader) {
        loader.classList.add("loading-hidden");
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <!-- Flet Web 必要載入腳本 -->
  <script src="flutter.js" defer></script>
  <script src="flet.js" defer></script>
</body>
</html>
