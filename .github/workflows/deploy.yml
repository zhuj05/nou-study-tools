name: Deploy Flet App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # 如果根目錄有 requirements.txt，建議解開註解：
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Web App
        run: |
          flet build web --base-url /nou-study-tools/ --yes

      # 打包完成後，複製 SEO 與驗證檔到輸出目錄
      - name: Copy SEO and Verification Files
        run: |
          if [ -f "$GITHUB_WORKSPACE/google7aa03728a73fed37.html" ]; then
            cp "$GITHUB_WORKSPACE/google7aa03728a73fed37.html" build/web/
          fi
          if [ -f "$GITHUB_WORKSPACE/web/robots.txt" ]; then
            cp "$GITHUB_WORKSPACE/web/robots.txt" build/web/
          fi
          if [ -f "$GITHUB_WORKSPACE/web/sitemap.xml" ]; then
            cp "$GITHUB_WORKSPACE/web/sitemap.xml" build/web/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
